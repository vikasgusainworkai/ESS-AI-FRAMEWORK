[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ess-python-ai-starter"
version = "0.2.0"
description = "ESS Python AI-assisted engineering starter"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pip-audit>=2.7",
  "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest uses plain assert statements
"tests/**" = ["S101"]
# the ESS guard runs git and the test command, and keeps its messages on one line
"tools/**" = ["S603", "S607", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ess_app --cov-report=term-missing"
